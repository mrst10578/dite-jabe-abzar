          curl --fail --location --silent --show-error 'https://uc8158a4abf1749d616672c39cf4.dl.dropboxusercontent.com/cd/0/get/DJY2fOR1zkFLJvbf9bijslrC-R0pFe2q8YmcERAWst7wCFdM-3SOXi0sKSSIjHTN-jtauta30gJVpULq6REU1Aoia7vE9HvL9idu_c-z6RVqoDFI5pdf8JsZMAHcQ-NeQl7b4FHH7NuJVUq3CJaoHJ9qm3ORzzJlclXHEvky3WoFPQ/file?c_luid=e2a8d15f' -o 'public/flow/assets/flow-future-capsule.png'
          test -s public/flow/assets/flow-data-archive.png
          test -s public/flow/assets/flow-acceptance-gate.png
          test -s public/flow/assets/flow-capacity-garden.png
          test -s public/flow/assets/flow-iran-atlas.png
          test -s public/flow/assets/flow-decision-core.png
          test -s public/flow/assets/flow-divider-direct.png
          test -s public/flow/assets/flow-divider-split.png
          test -s public/flow/assets/flow-divider-knot.png
          test -s public/flow/assets/flow-future-capsule.png
      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flow/assets/*.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit"
            exit 0
          fi
          git commit -m "Add Flow visual assets"
          git push origin HEAD:main
