name: Import Flow assets from Dropbox

on:
  push:
    paths:
      - ".github/workflows/import-flow-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download Flow assets from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/flow/assets
          curl --fail --location --silent --show-error 'https://ucd3396d6cd439c2b2d0d2698c8f.dl.dropboxusercontent.com/cd/0/get/DJaAwscv8zp9rgtU6_9C6GXuYmdzAqcjnce5m9eaIBmJRR1eQYCufRmN8TWloUrrzaUQ3oI9GwWutGmMJqEDU54TWLgHxjzG05M9CMYsbVw5Q2e8TzclcXnTmV0y_V_VaV5y8s-tS6JA1f6rmzr8FDIYsXuCOz0upkEToiC6-_B8eQ/file?c_luid=e2a8d15f' -o 'public/flow/assets/flow-data-archive.png'
          curl --fail --location --silent --show-error 'https://uc2df0663028f05be75d779d0001.dl.dropboxusercontent.com/cd/0/get/DJaPNtgu35z9Nr9dr5icsgnPxnvbJ1Kp-olBVBr6mwVb-wWDahUULBkLbPCcLrQXInULVSVfc6LJiAGm4lKU90GxcNzbeO2aD9-4dDWIawFNe2dXAipBFub8Ichqy96pha-cu0HrjB8vne3Xwg5_A9c0Q_aZEUflP6GFqKnMjnUuWg/file?c_luid=e2a8d15f' -o 'public/flow/assets/flow-acceptance-gate.png'
