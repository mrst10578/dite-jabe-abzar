          curl --fail --location --silent --show-error 'https://uc65113775ec896d0b9da86b96bf.dl.dropboxusercontent.com/cd/0/get/DJb53GWnn5ylD-R-sXapZR7jUHu3AM5HThTzXYMpDonuKaA3f86xx3uJaHRtPOmQ9I1IQOfWTN_fytS7jcmzcZWfeaLWAQlkd8CDGBTK-ic4i4X8PFNKCYHvGcT4HfXOdU2ymSk2jCmmJQENw9eumwxTBb_p_gREBHYZUgaczHErng/file?c_luid=e2a8d15f' -o 'public/flow/assets/flow-divider-split.png'
