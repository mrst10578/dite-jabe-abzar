name: Flow live-domain probe

on:
  push:
    branches: [main]
    paths:
      - "wrangler.jsonc"
      - "wrangler.backup.jsonc"
      - "public/_headers"
      - "public/sw.js"
      - "public/flow/**"
      - ".github/workflows/deploy-cloudflare.yml"
      - ".github/workflows/live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-live-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils

      - name: Check DigitalPlat delegation
        shell: bash
        run: |
          set +e
          for ns in ns1.digitalplat.org ns2.digitalplat.org ns3.digitalplat.org ns4.digitalplat.org; do
            echo "===== parent $ns ====="
            dig +time=4 +tries=1 @"$ns" flowkonkour.dpdns.org NS
          done

      - name: Validate public DNS
        shell: bash
        run: |
          set +e
          for host in flowkonkour.dpdns.org www.flowkonkour.dpdns.org; do
            echo "===== $host ====="
            for resolver in 1.1.1.1 8.8.8.8 9.9.9.9 208.67.222.222; do
              echo "-- resolver=$resolver A --"
              dig +time=4 +tries=1 @"$resolver" "$host" A +dnssec
              echo "-- resolver=$resolver AAAA --"
              dig +time=4 +tries=1 @"$resolver" "$host" AAAA +dnssec
              echo "-- resolver=$resolver NS --"
              dig +time=4 +tries=1 @"$resolver" "$host" NS
            done
          done

      - name: Probe Flow endpoints
        shell: bash
        run: |
          set +e
          urls=(
            "https://flowkonkour.dpdns.org/"
            "https://flowkonkour.dpdns.org/sw.js"
            "https://flowkonkour.dpdns.org/capacity/"
            "https://flowkonkour.dpdns.org/last-admissions/"
            "https://www.flowkonkour.dpdns.org/"
            "https://entekhab-reshte.flow1.workers.dev/"
            "https://entekhab-reshte-backup.flow1.workers.dev/"
          )

          for url in "${urls[@]}"; do
            echo "===== $url ====="
            host="$(echo "$url" | sed -E 's#https?://([^/]+)/?.*#\1#')"
            echo "-- system DNS --"
            getent hosts "$host" || true
            echo "-- HEAD --"
            curl -sS -I -L --max-time 20 "$url" || true
            echo "-- GET --"
            curl -sS -L --max-time 20 -o /tmp/flow-body -w "status=%{http_code} final=%{url_effective} size=%{size_download} time=%{time_total}\n" "$url" || true
            head -c 220 /tmp/flow-body 2>/dev/null || true
            echo
          done

      - name: Verify cache and security headers
        shell: bash
        run: |
          set +e
          for url in             "https://flowkonkour.dpdns.org/"             "https://flowkonkour.dpdns.org/flow/theme.css"             "https://flowkonkour.dpdns.org/capacity/data/manifest.json"             "https://flowkonkour.dpdns.org/sw.js"; do
            echo "===== $url ====="
            curl -sS -I -L --max-time 20 "$url" | grep -Ei '^(HTTP/|cache-control:|cf-cache-status:|etag:|x-content-type-options:|referrer-policy:|x-frame-options:|permissions-policy:|service-worker-allowed:)' || true
          done
