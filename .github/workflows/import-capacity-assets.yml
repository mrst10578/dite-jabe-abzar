name: Import Flow capacity assets

on:
  push:
    paths:
      - ".github/workflows/import-capacity-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download staged assets from Dropbox
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/capacity/assets
          curl -fL --retry 2 'https://uce3317e6f6591c5166431772798.dl.dropboxusercontent.com/cd/0/get/DJbht2SV87nZ9Jh0lL4znVeVczt-KLW-4StdSoD87KgttcTvgpr2kl8Dxv2wWWc5Xfgw5xIBitLfHUnFPNnUtkkUcpJP2Jwr2DqQjR7b1PdxLFx-jT3eTqD_cZy05po2H-_hW1j7nKjrDg60Wd7--7gXjUsbygfC3fPjcDNqX1mebw/file?c_luid=e2a8d15f' -o public/capacity/assets/capacity-core.png
          curl -fL --retry 2 'https://uc0a31cea3e54530b03d8e2ee261.dl.dropboxusercontent.com/cd/0/get/DJbttzgdnWLDLjBSggDdLt3bdL1_p4PF-cjXYxoKCKL1ifhVfN-lf8zdjXOmFj12t8LMLzrf4RXMc1rlyXwd-sLpBr9BqE8DDjCoGGk554W85dm7Ni55yQw92QWwLw-QfrhJUCAzWPLX7Khjro5lUk4tIx7MAqt4qFyab62gC2oHwQ/file?c_luid=e2a8d15f' -o public/capacity/assets/group-science-orbs.png
          curl -fL --retry 2 'https://uc28ca13e3ff9f2bb06845d838e0.dl.dropboxusercontent.com/cd/0/get/DJYRWcZrBZb_6wRVo2mwRTZNI1-al1o9N3VGRucfZkbSufULxr7z8XXv-nUzMCwulpxQ_D_uJT5UZfhyBwmiZrXJ0E547esrD4e37EeDbjvT1ZIg5Onc6V_f0hHMRB7jFtyF35njSKnR4lQLKQLB-7VbvhbLmnBVVxL5nf7tuBqvmQ/file?c_luid=e2a8d15f' -o public/capacity/assets/major-branches.png
          curl -fL --retry 2 'https://uc9d8c700b82d850e023b1cf9454.dl.dropboxusercontent.com/cd/0/get/DJZezh8ZcUH89UM_SAwngGC0E4CRdh_MOTOibw8MUkqG2Nr2F7pUcORqOMl2xxe7O7u15zsE9IxKFiHTZMWfuLT-QuMeRJkMPxg2c8BYEskVpIMaL_xxI1IaxkIIFwOPvJkkkgwy5F4NwQB6c8wPo5J3a1h1iHWCUe8FlG3fIdy0GQ/file?c_luid=e2a8d15f' -o public/capacity/assets/university-island.png
          curl -fL --retry 2 'https://uc6191cb834a9491e9544910a6a3.dl.dropboxusercontent.com/cd/0/get/DJb6edZ1nTBrBWin5Qi7dUYl5nMZAbVwZTDh10DVO2u-aiYKD9h2YxpHbbH76u_1w-g44VbssEljDCgmRrS7MTg2y1o1R0L-s2jR5FmAZC4QizQ_w1SUlXYDR60juGB3-FqBggWEVI0XQIcMp1EP_duWcUXgr7IpvIdfFqZu3jcNNg/file?c_luid=e2a8d15f' -o public/capacity/assets/capacity-years.png
          curl -fL --retry 2 'https://uc3f38f468731d7d9fe5cbcecdf9.dl.dropboxusercontent.com/cd/0/get/DJbxls8o5b5y1ImGFswQQjiiElvb8J3rXyMkG9XspG4t2Zw2WYHFVeuZS4Yq-FzVG5buFtaUCjo4mFBWfdSqf-KEqWi-PFYcmyc_LtWdYvoTisfGod0sLkyqDrFCzjcRUrchgfCQtuASJFute6ibJ1-STnphzOGwyjzEqLYbev_xhQ/file?c_luid=e2a8d15f' -o public/capacity/assets/data-archive.png

          test "$(stat -c%s public/capacity/assets/capacity-core.png)" -gt 1000000
          test "$(stat -c%s public/capacity/assets/group-science-orbs.png)" -gt 1000000
          test "$(stat -c%s public/capacity/assets/major-branches.png)" -gt 1000000
          test "$(stat -c%s public/capacity/assets/university-island.png)" -gt 1000000
          test "$(stat -c%s public/capacity/assets/capacity-years.png)" -gt 1000000
          test "$(stat -c%s public/capacity/assets/data-archive.png)" -gt 1000000
          file public/capacity/assets/*.png

      - name: Commit assets into repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/capacity/assets/*.png
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Add Flow capacity page assets"
          git push origin HEAD:main
