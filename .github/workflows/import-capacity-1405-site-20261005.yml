name: Import 1405 capacity supplement
on:
  push:
    paths:
      - ".github/workflows/import-capacity-1405-site-20261005.yml"
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 1405 experimental capacity CSV
        env:
          SOURCE_URL: "https://ucfae42fb6d2546058ff49d1aa21.dl.dropboxusercontent.com/cd/0/get/DJbTfTQr_YcrlyusS-gXaBDaKdyhZ-OyZfdbRcSjy9dD0q4u6X_1Nk5CsX_wK4imu8wD0KqUjI4hbGJM3-qzPjWgH5oJmDFI7_OmXFVrux2GC-J6evsCsINyjiKm70oHiqDmkCsaVt27rRbSHHMR3YlAsNkik8JmiRJdwCExFj1NzA/file?c_luid=e2a8d15f"
        run: |
          set -euo pipefail
          mkdir -p public/capacity/data/source
          curl --fail --location --silent --show-error "$SOURCE_URL" -o public/capacity/data/source/1405.csv
          echo "1dbc4ccb758029487009b081a2674eef9b1718105515678d5bdc0ce0cb37888b  public/capacity/data/source/1405.csv" | sha256sum -c -
      - name: Commit supplement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/capacity/data/source/1405.csv
          git commit -m "data: add 1405 experimental capacity supplement"
          git push
