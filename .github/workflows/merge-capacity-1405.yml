name: Merge 1405 capacity snapshot

on:
  push:
    paths:
      - ".github/workflows/merge-capacity-1405.yml"

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      BUNDLE_URL: "https://uc7d8e9c324d4d31bbd2d62d05c9.dl.dropboxusercontent.com/cd/0/get/DJbxG4HMuEEcwoFMJL5LR2HgGxEptEDZhbMw5HytoOP2UPkTUmBKTYAkNb11d9xvx-YLWagPIjIbfWFsYXvDa58mXjIU6_ivcOihMATcJ1WblENbipyT694H6krdeXuq5g3gP1Zn7eu-DEskzILXMRud0vITbJTEJ_eNf4-tFVu0WA/file?c_luid=e2a8d15f"
    steps:
      - uses: actions/checkout@v4

      - name: Merge 1405 snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$BUNDLE_URL" -o /tmp/cap1405.zip
          unzip -q /tmp/cap1405.zip -d /tmp/cap1405
          node scripts/activate-1405-snapshot.mjs /tmp/cap1405/capacities-all.csv e3bad95adaa1df9822396021963afef1b41d3539 2026-10-05T06:30:42Z

      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/capacity/data
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "data: add 1405 experimental capacity snapshot"
          git push
