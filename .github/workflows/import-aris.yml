name: Assemble original Aris HTML

on:
  push:
    branches: [main]
    paths: ["_import/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore exact original file
        run: node scripts/build-static.mjs
      - name: Commit original HTML and remove transfer chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          if test -d _import; then git rm -r _import; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Store original Aris toolbox HTML"
          git push origin HEAD:main
